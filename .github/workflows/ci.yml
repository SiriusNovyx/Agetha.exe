name: Windows and Linux CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      PYTHONUTF8: "1"
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: >-
          python -m pip install
          "pillow>=10.0.0,<12.0.0"
          "pytesseract>=0.3.10,<1.0.0"
          "requests>=2.28.0,<3.0.0"

      - name: Compile shared modules
        run: python -m compileall agetha main.py

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Run focused Fast Mode profile suite
        run: python -m unittest tests.test_fast_mode_profile -v

      - name: Run focused Fast Mode runtime suite
        run: python -m unittest tests.test_fast_mode_runtime -v

      - name: Run focused Dashboard and Medic suite
        run: python -m unittest tests.test_fast_mode_ui_medic -v

      - name: Run focused Fast Mode security suite
        run: python -m unittest tests.test_fast_mode_security -v

      - name: Import shared platform modules
        shell: bash
        run: python -c "import agetha.app_config, agetha.core.ai_engine, agetha.core.fast_mode_profile, agetha.platform.screen_reader, agetha.platform.window_control, agetha.ui.dashboard, medic_helper"

      - name: Parse Windows Medic script
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content -Raw ./Medic_Checker.ps1))'

      - name: Run Windows Medic status smoke
        if: runner.os == 'Windows'
        run: python medic_helper.py fast_mode_status

      - name: Run Windows locking and path smokes
        if: runner.os == 'Windows'
        run: >-
          python -m unittest -v
          tests.test_fast_mode_security.FastModeSecurityTests.test_normal_preexisting_unlocked_lock_file_succeeds
          tests.test_fast_mode_security.FastModeSecurityTests.test_mocked_reparse_lock_path_is_rejected
          tests.test_fast_mode_security.FastModeSecurityTests.test_descriptor_path_identity_mismatch_is_rejected
          tests.test_fast_mode_security.FastModeSecurityTests.test_lock_timeout_returns_profile_busy_without_changes
          tests.test_fast_mode_security.FastModeSecurityTests.test_case_insensitive_path_key_comparison_is_supported
          tests.test_fast_mode_security.FastModeCliTests.test_reconcile_and_restore_commands_round_trip

      - name: Run Linux Fast Mode status smoke
        if: runner.os == 'Linux'
        run: python -m agetha.core.fast_mode_profile status

      - name: Run Linux transaction, lock, and symlink smokes
        if: runner.os == 'Linux'
        run: >-
          python -m unittest -v
          tests.test_fast_mode_security.FastModeSecurityTests.test_config_symlink_is_refused
          tests.test_fast_mode_security.FastModeSecurityTests.test_snapshot_symlink_is_refused
          tests.test_fast_mode_security.FastModeSecurityTests.test_lock_symlink_is_refused
          tests.test_fast_mode_security.FastModeSecurityTests.test_lock_timeout_returns_profile_busy_without_changes
          tests.test_fast_mode_security.FastModeSecurityTests.test_lock_released_during_retry_is_acquired
          tests.test_fast_mode_security.FastModeCliTests.test_status_is_read_only_and_machine_readable
          tests.test_fast_mode_security.FastModeCliTests.test_reconcile_and_restore_commands_round_trip
          tests.test_fast_mode_profile.FastModeProfileTests.test_snapshot_permissions_are_user_only_on_posix

      - name: Run mocked Linux desktop-path smokes
        if: runner.os == 'Linux'
        run: >-
          python -m unittest -v
          tests.test_screen_monitoring_reliability.TestCaptureBehavior.test_05a_linux_xdotool_metadata_includes_process_name
          tests.test_screen_monitoring_reliability.TestCaptureBehavior.test_05b_linux_wmctrl_metadata_includes_process_name
          tests.test_screen_monitoring_reliability.TestCaptureBehavior.test_05c_linux_process_resolver_falls_back_to_xprop_pid
          tests.test_screen_monitoring_reliability.TestCaptureBehavior.test_12h_linux_preserved_target_refreshes_geometry
          tests.test_screen_monitoring_reliability.TestCaptureBehavior.test_12i_linux_preserved_target_rejects_reused_xid
          tests.test_screen_monitoring_reliability.TestCaptureBehavior.test_12j_linux_preserved_target_rejects_closed_window
